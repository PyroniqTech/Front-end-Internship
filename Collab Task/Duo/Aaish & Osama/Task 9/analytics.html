<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Provide resuable content">
<title>Taskgrid | Analytics</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="static/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="static/js/script.js"></script>
<script>
    loadPage("base.html", ` 
    <section class="bg-black text-blue-400">
      <div class="container mx-auto px-4 py-10">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
      <div class="bg-slate-900 p-6 rounded-lg shadow-md border border-blue-700">
        <p class="text-sm text-blue-300">Total Tasks</p>
        <p id="totalTasks" class="text-3xl font-bold text-blue-400">—</p>
      </div>
      <div class="bg-slate-900 p-6 rounded-lg shadow-md border border-blue-700">
        <p class="text-sm text-blue-300">Completed</p>
        <p id="completedTasks" class="text-3xl font-bold text-blue-400">—</p>
      </div>
      <div class="bg-slate-900 p-6 rounded-lg shadow-md border border-blue-700">
        <p class="text-sm text-blue-300">Pending</p>
        <p id="pendingTasks" class="text-3xl font-bold text-blue-400">—</p>
      </div>
      <div class="bg-slate-900 p-6 rounded-lg shadow-md border border-blue-700">
        <p class="text-sm text-blue-300">Avg Progress</p>
        <p id="avgProgress" class="text-3xl font-bold text-blue-400">—</p>
      </div>
    <section class="mb-12">
        <h2 class="text-2xl font-semibold text-blue-500 mb-6">Team Progress</h2>
      <div class="space-y-6" id="teamProgress">        
      </div>
    </section>
    <section class="text-center">
        <h2 class="text-2xl font-semibold text-blue-500 mb-6">Overall Task Completion</h2>
      <div class="bg-slate-900 p-8 rounded-lg shadow-lg border border-blue-700 inline-block">
        <div class="relative w-48 h-48 rounded-full border-8 border-slate-800 mx-auto">
          <div id="chartFill"
            class="absolute inset-0 rounded-full border-8 border-blue-500"
            style="clip-path: inset(20% 0 0 0); transform: rotate(0deg); transition: transform 1s ease;">
          </div>
        </div>
          <p class="mt-6 text-xl font-bold text-blue-400" id="chartLabel">Loading...</p>
      </div>
    </section>
    `);

    
</script>
