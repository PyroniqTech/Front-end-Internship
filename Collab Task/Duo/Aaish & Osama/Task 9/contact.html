<meta name="description" content="Contact Taskgrid for more details.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskgrid | Contact Us</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<body class="min-h-screen flex flex-col text-gray-800">
  <div id="app" class="container mx-auto px-6 py-12"></div>
  <script src="static/js/script.js"></script>
  <script>
      loadPage("base.html", `
       <section class="py-3 px-6 md:px-7 lg:px-20 bg-black">
    <h2 class="text-4xl lg:text-5xl md:text-left text-center font-extrabold text-white mb-12">Contact Us</h2>
    <div class="grid lg:grid-cols-2 gap-10 ">
      <div class="bg-gray-900 rounded-lg p-8 shadow-md space-y-6">
        <h3 class="md:text-3xl text-xl font-bold text-blue-400">We are here to help you</h3>
        <p class="text-gray-200 font-light">Have any questions? We'd love to hear from you. Reach out to us through the following:</p>
               
        <div>
          <p class="font-medium text-blue-400 "> Office Address:</p>
          <p class="text-white font-light ">Shahrah Faisal, Karachi</p>
        </div>

        <div>
          <p class="font-medium text-blue-400"> Phone:</p>
          <p class="text-white font-light">+92 300 1234567</p>
        </div>

        <div>
          <p class="font-medium text-blue-400"> Email:</p>
          <p class="text-white font-light">support@TaskGrid.com</p>
        </div>

      </div>
      <div class="order-1 md:order-2 flex w-full">

          <img src="static/images/contact-us.png" alt="contact Taskgrid" loading="lazy" class="order-2 md:order-1">
      </div>
      </div>

       <div class=" flex justify-center item-center gap-10 mt-12">

      <form id="contactForm" class=" border border-cyan-700 w-full md:w-3/4 lg:w-1/2 p-8 space-y-6 bg-gray-900 text-gray-300 text-xs rounded-lg">
        <div>
          <label for="name" class="block text-sm font-medium text-cyan-500">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required
            class="mt-1 block w-full px-4 py-2 border rounded-lg border-gray-700 focus:border-cyan-600 outline-none">
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-cyan-500">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required
            class="mt-1 block w-full px-4 py-2 border rounded-lg border-gray-700 focus:border-cyan-600 outline-none">
        </div>

        <div>
          <label for="subject" class="block text-sm font-medium text-cyan-500">Subject</label>
          <textarea type="text" id="subject" name="subject" rows="2" placeholder="subject:"  
            class="mt-1 block w-full px-4 py-2 border rounded-lg  border-gray-700 focus:border-cyan-600 outline-none"></textarea>
        </div>

        <div>
          <label for="Message" class="block text-sm font-medium text-cyan-500">Message</label>
          <textarea type="text" id="message" name="message" rows="2" placeholder="Write your message..." required
            class="mt-1 block w-full px-4 py-2 border rounded-lg bg-gray-900  border-gray-700 focus:border-cyan-600 outline-none"></textarea>
        </div>

        <button type="submit"
          class="w-full bg-cyan-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-400 transition cursor-pointer">
          Send Message
        </button>
      </form>
      </div>
      
      <aside>
        <div class="flex justify-center gap-6 mt-10 text-cyan-500 text-xl">
          <a href=".facebook/taskgrid.com" aria-label="Facebook" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook transition transform hover:scale-125 duration-300"></i></a>
          <a href=".linkedin/taskgrid.com" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin transition transform hover:scale-125 duration-300"></i></a>
          <a href=".instagram/taskgrid.com" aria-label="Instagram" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram transition transform hover:scale-125 duration-300"></i></a>
          <a href=".youtube/taskgrid.com" aria-label="YouTube" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube transition transform hover:scale-125 duration-300"></i></a>
        </div>
      </aside>

    </section>

  `);
  </script>           

  </body>
