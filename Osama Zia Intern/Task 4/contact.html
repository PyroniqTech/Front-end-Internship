<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exploria — Contact</title>
<meta name="description" content="Get in touch with Exploria Travel Agency for inquiries, bookings, and travel assistance" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<body>
   <div id="app" class="container mx-auto px-6 py-12"></div>
   <script src="js/script.js"></script>
   <script>
     loadPage("base.html", `
       <div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-2xl overflow-hidden grid md:grid-cols-2">
      <div class="p-8 md:p-12">
         <h1 class="text-3xl md:text-4xl font-bold text-sky-700 mb-6 text-center md:text-left">Contact Us</h1>
         <form id="contact-form" class="space-y-5" novalidate>
      <div>
        <label class="block text-sm font-medium mb-1">Name *</label>
        <input type="text" id="c-name" name="name" required
        placeholder="Osama Zia"
        class="w-full border border-slate-300 focus:border-sky-500 focus:ring focus:ring-sky-200 rounded-lg px-4 py-2 transition" />
      </div>
    <div>
        <label class="block text-sm font-medium mb-1">Email *</label>
        <input type="email" id="c-email" name="email" required
        placeholder="example@email.com"
        class="w-full border border-slate-300 focus:border-sky-500 focus:ring focus:ring-sky-200 rounded-lg px-4 py-2 transition" />
      </div>
    <div>
        <label class="block text-sm font-medium mb-1">Message *</label>
        <textarea id="c-message" rows="5" required
          placeholder="Type your message here..."
          class="w-full border border-slate-300 focus:border-sky-500 focus:ring focus:ring-sky-200 rounded-lg px-4 py-2 transition"></textarea>
       </div>
     <div class="text-center md:text-right">
         <button type="submit"
          class="px-6 py-2 bg-sky-600 hover:bg-sky-700 rounded-lg text-white font-medium shadow-md transition transform hover:scale-105">
          Send Message
        </button>
      </div>
       </form>
    </div>
      <aside class="bg-gradient-to-br from-sky-600 to-blue-700 text-white p-8 md:p-12 flex flex-col justify-center">
      <h3 class="text-xl font-semibold mb-4">Contact Info</h3>
       <p class="mb-2"><strong>Address:</strong> G-11 Markaz, Islamabad, Pakistan</p>
       <p class="mb-2"><strong>Phone:</strong>+(92) 330 220 1111</p>
       <p><strong>Email:</strong> info@exploria.com</p>
      <div class="mt-6 flex space-x-4">
        <a href="#" aria-label="Facebook"
        class="bg-white/20 hover:bg-white/30 p-2 rounded-full transition">
        <i class="fab fa-facebook-f"></i>
      </a>
        <a href="#" aria-label="Instagram"
         class="bg-white/20 hover:bg-white/30 p-2 rounded-full transition">
         <i class="fab fa-instagram"></i>
        </a>
      <a href="#" aria-label="YouTube"
         class="bg-white/20 hover:bg-white/30 p-2 rounded-full transition">
         <i class="fab fa-youtube"></i>
      </a>
      </div>
    </aside>
   </div>
  </div>
       `);
       </script> 
</body>
