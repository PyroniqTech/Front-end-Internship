<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Exploria Travel Agency. Send us a message and we'll get back to you.">
  <title>Exploria | Contact</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
  <div id="app" class="container mx-auto px-6 py-12"></div>
  <script src="js/script.js"></script>
  <script>
    loadPage("base.html", `
      <main>
        <section class="py-12">
          <h1 class="text-3xl md:text-4xl font-extrabold text-center">Contact Us</h1>
          <div class="mt-8 max-w-3xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
              <form id="contactForm" class="space-y-4 bg-gray-800 p-6 rounded-lg">
                <div><label class="block text-sm">Name</label><input id="cname" type="text" required class="mt-1 w-full rounded-md bg-gray-700 border border-gray-600 px-3 py-2"></div>
                <div><label class="block text-sm">Email</label><input id="cemail" type="email" required class="mt-1 w-full rounded-md bg-gray-700 border border-gray-600 px-3 py-2"></div>
                <div><label class="block text-sm">Message</label><textarea id="cmessage" required class="mt-1 w-full rounded-md bg-gray-700 border border-gray-600 px-3 py-2 h-28"></textarea></div>
                <div class="text-right"><button type="submit" class="px-4 py-2 rounded-md bg-blue-600">Send Message</button></div>
              </form>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg flex flex-col justify-center">
              <h2 class="text-xl font-semibold mb-4">Our Info</h2>
              <p>123 Bahria Town, Lahore</p>
              <p class="mt-2">Phone: +92 123-4567890</p>
              <p class="mt-2">Email: contact@exploria.com</p>
            </div>
          </div>
        </section>
      </main>
    `);
  </script>
</body>
</html>
