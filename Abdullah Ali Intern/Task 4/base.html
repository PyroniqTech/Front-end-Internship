<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Exploria Travel Agency - Explore destinations around the world.">
  <title>Exploria | Base</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 bg-gray-950">
    <div class="container mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <img src="images/logo.jpg" alt="Exploria logo" class="h-10 w-10 object-cover rounded">
        <span class="text-lg font-bold">Exploria</span>
      </a>
      <nav class="hidden md:flex items-center gap-6" role="navigation" aria-label="Main navigation">
        <a href="index.html" class="hover:text-amber-400">Home</a>
        <a href="destinations.html" class="hover:text-amber-400">Destinations</a>
        <a href="contact.html" class="hover:text-amber-400">Contact</a>
      </nav>
      <button id="hamburger-btn" aria-expanded="false" class="md:hidden p-2 rounded bg-gray-800">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-gray-900" role="menu" aria-hidden="true">
      <div class="flex flex-col px-6 py-4">
        <a href="index.html" class="py-2 border-b border-gray-800">Home</a>
        <a href="destinations.html" class="py-2 border-b border-gray-800">Destinations</a>
        <a href="contact.html" class="py-2">Contact</a>
      </div>
    </div>
  </header>

  <div id="slot"></div>

  <footer class="bg-gray-950 mt-12">
    <div class="container mx-auto px-6 py-8 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <img src="images/logo.jpg" alt="Exploria logo" class="h-8 w-8 object-cover rounded">
        <div class="font-semibold">Exploria</div>
      </div>
      <div class="flex items-center gap-4">
        <a href="https://facebook.com" aria-label="Visit our Facebook" target="_blank" rel="noopener noreferrer">
          <i data-lucide="facebook" class="w-6 h-6 text-gray-400 hover:text-amber-400"></i>
        </a>
        <a href="https://instagram.com" aria-label="Visit our Instagram" target="_blank" rel="noopener noreferrer">
          <i data-lucide="instagram" class="w-6 h-6 text-gray-400 hover:text-amber-400"></i>
        </a>
        <a href="https://youtube.com" aria-label="Visit our YouTube" target="_blank" rel="noopener noreferrer">
          <i data-lucide="youtube" class="w-6 h-6 text-gray-400 hover:text-amber-400"></i>
        </a>
      </div>
      <div class="text-sm text-gray-400">123 Explorer Ave, Wander City • © 2025 Exploria</div>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
