  <title>Eventure — Contact</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
<nav class="bg-gray-800/60 backdrop-blur sticky top-0 z-40">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <img loading="lazy" src="images/logo.jpeg" alt="Eventure" class="w-12 h-12 rounded-full object-cover" />
      <span class="text-2xl font-semibold text-blue-400">Eventure</span>
    </a>
    <div class="hidden md:flex gap-6 items-center text-gray-200">
      <a href="index.html" class="hover:text-white">Home</a>
      <a href="speakers.html" class="hover:text-white">Speakers</a>
      <a href="contact.html" class="hover:text-white">Contact</a>
    </div>
    <div class="md:hidden">
      <button id="menuBtn" aria-label="Open menu" class="p-2 rounded bg-gray-700">☰</button>
    </div>
  </div>
  <div id="mobileMenu" class="hidden flex-col px-4 pb-4 md:hidden bg-gray-800 text-gray-200">
    <a href="index.html" class="block py-2 hover:text-white">Home</a>
    <a href="speakers.html" class="block py-2 hover:text-white">Speakers</a>
    <a href="contact.html" class="block py-2 hover:text-white">Contact</a>
  </div>
</nav>


  <main class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold">Contact Us</h1>
    <p class="text-gray-300 mt-2">Have questions? Drop us a message and we'll get back to you.</p>

    <section class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
      <form id="contactForm" class="bg-gray-800 p-4 rounded-lg">
        <label class="block">Name <input name="name" required class="w-full mt-1 p-2 rounded bg-gray-700" /></label>
        <label class="block mt-3">Email <input name="email" type="email" required class="w-full mt-1 p-2 rounded bg-gray-700" /></label>
        <label class="block mt-3">Message <textarea name="message" rows="5" required class="w-full mt-1 p-2 rounded bg-gray-700"></textarea></label>
        <div class="mt-4"><button type="submit" class="px-4 py-2 rounded bg-blue-500">Send Message</button></div>
      </form>

      <aside class="bg-gray-800 p-4 rounded-lg">
        <h3 class="font-semibold">Contact Info</h3>
        <p class="text-gray-300 mt-2">Address: New Nazimabad Block B, Karachi</p>
        <p class="text-gray-300 mt-1">Phone: (+92) 123-4567-890</p>
        <p class="text-gray-300 mt-1">Email: hello@eventure.online</p>
      </aside>
    </section>
  </main>

      <div class="flex items-center gap-3"><img loading="lazy"src="images/logo.jpeg" class="w-10 h-10 rounded" /><span class="text-blue-400 font-semibold">Eventure</span></div>
      <div class="flex gap-4">
